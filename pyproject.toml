[project]
name = "stfr-production"
version = "0.1.0"
description = "Reproducible Python environment for the STFR production pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "diff-surfel-rasterization",
    "iopath==0.1.10",
    "jax==0.4.20",
    "jaxlib==0.4.20",
    "kornia==0.6.12",
    "lpips==0.1.4",
    "matplotlib==3.7.0",
    "mediapipe==0.10.11",
    "mediapy==1.2.7",
    "ninja==1.13.2",
    "numpy==1.26.4",
    "onnx==1.18.0",
    "onnxruntime-gpu==1.22.0",
    "open3d==0.19.0",
    "opencv-contrib-python==4.10.0.84",
    "opencv-python==4.10.0.84",
    "pillow==12.3.0",
    "pip==25.3",
    "plyfile==1.1.3",
    "protobuf==3.20.3",
    "pytorch3d @ https://dl.fbaipublicfiles.com/pytorch3d/packaging/wheels/py310_cu121_pyt231/pytorch3d-0.7.8-cp310-cp310-linux_x86_64.whl",
    "pyyaml==6.0.3",
    "scikit-image==0.25.2",
    "scipy==1.11.4",
    "setuptools==69.5.1",
    "simple-knn",
    "tensorboard==2.16.2",
    "tinycudann",
    "torch @ https://download.pytorch.org/whl/cu121/torch-2.3.1%2Bcu121-cp310-cp310-linux_x86_64.whl",
    "torchvision @ https://download.pytorch.org/whl/cu121/torchvision-0.18.1%2Bcu121-cp310-cp310-linux_x86_64.whl",
    "tqdm==4.70.0",
    "trimesh==5.1.0",
    "wheel==0.48.0",
    "xatlas==0.0.11",
    "yacs==0.1.8",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "tomli>=2; python_version < '3.11'",
]

[tool.uv]
package = false
required-version = ">=0.12.10"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# STFR's tested mediapipe stack uses protobuf 3.20.3 even though ONNX 1.18.0
# declares a newer lower bound. Keep this override until the matting stack moves.
override-dependencies = ["protobuf==3.20.3"]
no-build-isolation-package = [
    "diff-surfel-rasterization",
    "simple-knn",
    "tinycudann",
]

[tool.uv.sources]
diff-surfel-rasterization = { git = "https://github.com/hbb1/diff-surfel-rasterization.git", rev = "e0ed0207b3e0669960cfad70852200a4a5847f61" }
simple-knn = { git = "https://gitlab.inria.fr/bkerbl/simple-knn.git", rev = "f155ec04131cb579f53443a06879d37115f4612f" }
tinycudann = { git = "https://github.com/NVlabs/tiny-cuda-nn.git", rev = "749dd70c5afc5a9dadb85e5652ed65d55e0ba187", subdirectory = "bindings/torch" }

[tool.uv.extra-build-dependencies]
diff-surfel-rasterization = [{ requirement = "torch", match-runtime = true }]
simple-knn = [{ requirement = "torch", match-runtime = true }]
tinycudann = [{ requirement = "torch", match-runtime = true }]

[[tool.uv.dependency-metadata]]
name = "diff-surfel-rasterization"
version = "0.0.1"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "simple-knn"
version = "0.0.0"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "tinycudann"
version = "2.0"
requires-dist = []
